[project]
name = "naver-blog-writer-mcp"
version = "0.1.0"
description = "사진과 동영상으로 네이버 블로그 글을 임시저장해 주는 로컬 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.25,<2",
    "playwright>=1.48",
    "pydantic>=2.7",
    "pillow>=10.0",
    "pillow-heif>=0.18",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
naver-blog-writer = "naver_blog_writer.server:main"
naver-blog-login = "naver_blog_writer.login_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naver_blog_writer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
